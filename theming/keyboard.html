<script>
  (() => {
    // Quarto puts the before-body include after the header.
    const skip = document.querySelector(".skip-link");
    const main = document.getElementById("quarto-document-content");
    if (skip && main) {
      document.body.prepend(skip);
      main.tabIndex = -1;
    }

    const header = document.getElementById("quarto-header");
    const menu = header?.querySelector(".navbar-toggler");
    if (menu) {
      menu.removeAttribute("role");
      const menuOpen = () => menu.getClientRects().length && menu.getAttribute("aria-expanded") === "true";
      header.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || event.defaultPrevented || !menuOpen()) return;
        event.preventDefault();
        menu.click();
        menu.focus();
      });
      header.addEventListener("focusout", (event) => {
        if (event.relatedTarget && !header.contains(event.relatedTarget) && menuOpen()) menu.click();
      });
    }

    for (const toggle of document.querySelectorAll("a.quarto-color-scheme-toggle")) {
      toggle.setAttribute("role", "button");
      toggle.addEventListener("keydown", (event) => {
        if (event.key !== " ") return;
        event.preventDefault();
        if (!event.repeat) toggle.click();
      });
    }

    // The desktop loupe is decoration over the input. Enter in the input
    // activates the selected result, so the loupe needs no separate Tab stop.
    const search = document.getElementById("quarto-search");
    if (search) {
      const skipLoupe = () => {
        const loupe = search.querySelector(".aa-SubmitButton");
        if (loupe) loupe.tabIndex = -1;
      };
      new MutationObserver(skipLoupe).observe(search, { childList: true, subtree: true });
      skipLoupe();
    }

    // Quarto's detached search is full-screen. Keep Tab in the search until
    // it closes, then return focus to the search button or shortcut origin.
    let overlay;
    let opener = document.activeElement;
    document.addEventListener("focusin", (event) => {
      if (!event.target.closest(".aa-DetachedOverlay")) opener = event.target;
    });
    new MutationObserver(() => {
      const next = document.querySelector(".aa-DetachedOverlay");
      if (next === overlay) return;
      if (next) {
        next.setAttribute("role", "dialog");
        next.setAttribute("aria-modal", "true");
        next.setAttribute("aria-label", "Search");
      } else if (overlay && document.activeElement === document.body) {
        opener?.focus();
      }
      overlay = next;
    }).observe(document.body, { childList: true });

    document.addEventListener("keydown", (event) => {
      if (!overlay?.isConnected || event.defaultPrevented) return;
      if (event.key === "Escape") {
        overlay.querySelector(".aa-DetachedCancelButton")?.click();
        event.preventDefault();
      } else if (event.key === "Tab") {
        const controls = [...overlay.querySelectorAll("a[href], button, input, [tabindex]")]
          .filter((element) => element.tabIndex >= 0 && !element.matches(":disabled") &&
            element.getClientRects().length && getComputedStyle(element).visibility === "visible");
        const first = controls[0];
        const last = controls.at(-1);
        const active = document.activeElement;
        if (!overlay.contains(active) || active === (event.shiftKey ? first : last)) {
          event.preventDefault();
          (event.shiftKey ? last : first)?.focus();
        }
      }
    });
  })();
</script>
