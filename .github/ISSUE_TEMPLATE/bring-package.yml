name: Request to bring a package into JuliaBayes
description: Discuss bringing a Julia package into the JuliaBayes organization.
title: "Package to join JuliaBayes: "
body:
  - type: markdown
    attributes:
      value: |
        Your submission opens a public issue to discuss bringing the package into the JuliaBayes organization.
  - type: input
    id: package-name
    attributes:
      label: Package name
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why bring the package into JuliaBayes?
      description: Describe what the package does for Bayesian work in Julia and what you hope to gain by joining.
    validations:
      required: true
  - type: textarea
    id: maintainers
    attributes:
      label: Current maintainers
      description: List their GitHub handles and say whether you have discussed this request with them.
    validations:
      required: true
