# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"

# Do NOT add Julia updates! The point is that Project.toml / Manifest.toml
# files should be frozen in order to guarantee reproducibility, so deps should
# never be updated
