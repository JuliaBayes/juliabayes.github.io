<script>
(() => {
  const selector = ".accent-card, body.news-post #title-block-header";
  const enabled = matchMedia("(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) and (forced-colors: none)");
  if (!enabled.matches || !CSS.supports("color", "color-mix(in srgb, red, blue)") ||
      !document.querySelector(selector)) return;
  let card, frame = 0, x, y;
  const clear = () => {
    card?.removeAttribute("data-card-pointer");
    card = null;
    cancelAnimationFrame(frame);
    frame = 0;
  };
  document.addEventListener("pointermove", (event) => {
    if (!enabled.matches || event.pointerType === "touch") return;
    const next = event.target.closest(selector);
    if (next !== card) {
      clear();
      card = next;
    }
    if (!card) return;
    x = event.clientX;
    y = event.clientY;
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const bounds = card.getBoundingClientRect();
      card.style.setProperty("--card-x", `${x - bounds.left}px`);
      card.style.setProperty("--card-y", `${y - bounds.top}px`);
      card.setAttribute("data-card-pointer", "");
    });
  }, { passive: true });
  document.addEventListener("pointerleave", clear);
  document.addEventListener("scroll", clear, { capture: true, passive: true });
  window.addEventListener("blur", clear);
  enabled.addEventListener("change", clear);
})();
</script>
