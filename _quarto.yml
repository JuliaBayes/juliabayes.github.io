project:
  type: website
  # Explicit list: Quarto finds no inputs when the project path contains a
  # hidden directory (e.g. ~/.julia/dev/).
  render:
    - "/*.qmd"
    - "about/*.qmd"
    - "ecosystem/*.qmd"
    - "news/*.qmd"
    - "news/posts/**/*.qmd"
  resources:
    - CNAME
    # The font licence asks that it ships with the fonts. Quarto copies the
    # fonts themselves from the url() in theming/rules/_fonts.scss.
    - theming/fonts/LICENSE.txt
    # Browsers and iOS request these from the site root without a link tag.
    # src/favicon.jl generates them with favicon.svg.
    - favicon.ico
    - apple-touch-icon.png

website:
  title: "JuliaBayes"
  site-url: https://juliabayes.org
  favicon: favicon.svg
  description: "JuliaBayes is a shared home for Bayesian software in Julia."
  # Gives shared links a preview card, for example in Slack.
  open-graph: true
  search:
    type: textbox
  navbar:
    logo: favicon.svg
    # Quarto puts the logo in a link of its own, so it needs a name.
    logo-alt: "JuliaBayes home"
    left:
      - about/index.qmd
      - ecosystem/index.qmd
      - news/index.qmd
      - href: contact.qmd
        text: Contact
    # The links sit in the tools, next to the colour-scheme toggle and outside the
    # collapse, so that the search can come before them.
    tools:
      - icon: github
        href: https://github.com/JuliaBayes
        text: GitHub
      - icon: rss
        href: news/index.xml
        text: RSS feed

format:
  html:
    theme:
      light: [cosmo, theming/theme-light.scss]
      dark: [darkly, theming/theme-dark.scss]
    toc: true
    # The first visit follows the visitor's system setting. The toggle still
    # overrides it.
    respect-user-color-scheme: true
    include-after-body:
      - theming/theme-switch.html
      - theming/search-shortcut.html
      - theming/category-links.html

# Render Julia code locally and commit the results in _freeze/, so that CI
# doesn't need to run any Julia.
execute:
  freeze: auto
