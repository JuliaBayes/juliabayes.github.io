name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # 2.2.0
      - name: Test release feed
        run: node --test src/release-feed.test.mjs
      - name: Refresh package releases
        run: node src/package-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      # No need for julia here because outputs come from _freeze/
      - run: quarto render
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # 4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: previews/
          force: false
