  (() => {
    // The generated curves clear advances up to 9em on phones and 13.5em on
    // desktop. Wide text wraps to two lines if a desktop visit becomes narrow.
    const taglines = [

      "Aleatorically,",

      "Predictably,",
      "Understandably,",

      "Oh no! It's",

      "🎉",
      "Until next time,",
      "The Notorious",
      "🐦",
      "Finally,",
      "I am become",
      "My God, it's full of",
    ];
    const wideTaglines = [
      "With high probability,",
      "Up to normalization,",
      "More likely than not,",
      "Under mild assumptions,",
      "Pending more evidence,",

      "Through shared evidence,",

      "By the usual arguments,",

      "Despite label-switching,",
      "Beyond reasonable doubt,",

      "9/10 statisticians recommend",
      "Under regularity conditions,",
      "According to the posterior,",
      "Without loss of generality,",
    ];
    // Matches media-breakpoint-down(sm) in theming/rules/_hero.scss.
    const isPhone = window.matchMedia("(max-width: 575.98px)").matches;
    const candidates = isPhone ? taglines : taglines.concat(wideTaglines);
    // Insert the complete paragraph while the hero is parsed.
    const tagline = document.createElement("p");
    tagline.id = "hero-tagline";
    tagline.textContent =
      candidates[Math.floor(Math.random() * candidates.length)];
    if (wideTaglines.includes(tagline.textContent)) tagline.dataset.wide = "";
    document.currentScript.replaceWith(tagline);

    // Leave the complete first choice in place when animation is unavailable.
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (!window.Intl?.Segmenter || reducedMotion.matches) return;

    // Reserve the wider phone curve for this visit, so later choices cannot
    // move the title or cards after a desktop window becomes narrow.
    if (!isPhone) tagline.dataset.wide = "";

    const segmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
    const split = (value) => [...segmenter.segment(value)].map((part) => part.segment);
    const text = tagline.firstChild;

    let current = candidates.indexOf(text.data);
    let letters = split(candidates[current]);
    let count = letters.length;
    let erasing = true;
    let timer;
    const step = () => {
      if (document.hidden || reducedMotion.matches) {
        update();
        return;
      }
      count += erasing ? -1 : 1;
      text.data = letters.slice(0, count).join("");
      let delay = erasing ? 35 : 65;
      if (erasing && count === 0) {
        const offset = 1 + Math.floor(Math.random() * (candidates.length - 1));
        current = (current + offset) % candidates.length;
        letters = split(candidates[current]);
        erasing = false;
        delay = 250;
      } else if (!erasing && count === letters.length) {
        erasing = true;
        delay = 4500;
      }
      timer = window.setTimeout(step, delay);
    };
    const update = () => {
      window.clearTimeout(timer);
      letters = split(candidates[current]);
      count = letters.length;
      erasing = true;
      text.data = candidates[current];
      if (!document.hidden && !reducedMotion.matches) timer = window.setTimeout(step, 4500);
    };
    document.addEventListener("visibilitychange", update);
    reducedMotion.addEventListener("change", update);
    update();
  })();
</script>
