project:
  type: website
  # Explicit list: Quarto finds no inputs when the project path contains a
  # hidden directory (e.g. ~/.julia/dev/).
  render:
    - "/*.qmd"
    - "about/*.qmd"
    - "ecosystem/*.qmd"
    - "news/*.qmd"
    - "news/posts/**/*.qmd"
  resources:
    - CNAME

website:
  title: "JuliaBayes"
  site-url: https://juliabayes.org
  description: "News, notes, and discussion from the JuliaBayes organisation."
  search:
    type: textbox
  navbar:
    right:
      - about/index.qmd
      - ecosystem/index.qmd
      - news/index.qmd
      - icon: github
        href: https://github.com/JuliaBayes
      - icon: rss
        href: news/index.xml

format:
  html:
    theme:
      light: [cosmo, theming/theme-light.scss]
      dark: [darkly, theming/theme-dark.scss]
    toc: true
    include-after-body: theming/theme-switch.html

# Render Julia code locally and commit the results in _freeze/, so that CI
# doesn't need to run any Julia.
execute:
  freeze: auto
