project:
  type: website
  # Explicit list: Quarto finds no inputs when the project path contains a
  # hidden directory (e.g. ~/.julia/dev/).
  render:
    - "/*.qmd"
    - "about/*.qmd"
    - "ecosystem/*.qmd"
    - "news/*.qmd"
    - "news/posts/**/*.qmd"
  resources:
    - CNAME
    # The font licence asks that it ships with the fonts. Quarto copies the
    # fonts themselves from the url() in theming/rules/_fonts.scss.
    - theming/fonts/LICENSE.txt

website:
  title: "JuliaBayes"
  site-url: https://juliabayes.org
  description: "News, notes, and discussion from the JuliaBayes organisation."
  # Gives shared links a preview card, for example in Slack.
  open-graph: true
  search:
    type: textbox
  navbar:
    right:
      - about/index.qmd
      - ecosystem/index.qmd
      - news/index.qmd
      - icon: github
        href: https://github.com/JuliaBayes
        aria-label: GitHub
      - icon: rss
        href: news/index.xml
        aria-label: RSS feed

format:
  html:
    theme:
      light: [cosmo, theming/theme-light.scss]
      dark: [darkly, theming/theme-dark.scss]
    toc: true
    # The first visit follows the visitor's system setting. The toggle still
    # overrides it.
    respect-user-color-scheme: true
    include-after-body: theming/theme-switch.html

# Render Julia code locally and commit the results in _freeze/, so that CI
# doesn't need to run any Julia.
execute:
  freeze: auto
