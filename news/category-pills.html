<!-- Quarto renders category controls as clickable divs. Give them native
     keyboard behaviour and keep sidebar and in-list selection in sync. -->
<script>
  (() => {
    const listing = document.querySelector(".news-card .quarto-listing");
    const clear = document.getElementById("news-clear-category");
    const sidebar = document.querySelector(".quarto-listing-category");
    if (!listing || !clear || !sidebar) return;

    const asButton = (element) => {
      if (element instanceof HTMLButtonElement) return element;
      const button = document.createElement("button");
      for (const { name, value } of element.attributes) button.setAttribute(name, value);
      button.type = "button";
      button.append(...element.childNodes);
      element.replaceWith(button);
      return button;
    };

    // Replace sidebar controls before Quarto attaches its click handlers.
    const sidebarCategories = [...sidebar.querySelectorAll(".category")].map(asButton);
    const update = () => {
      const activeCategory = document.querySelector(
        ".quarto-listing-category .category.active",
      )?.dataset.category;
      for (const button of sidebarCategories) {
        button.setAttribute("aria-pressed", String((activeCategory ?? "") === button.dataset.category));
      }
      clear.disabled = !activeCategory;
      for (const element of listing.querySelectorAll(".listing-category")) {
        const pill = asButton(element);
        const isActive =
          Boolean(activeCategory) &&
          pill.getAttribute("onclick")?.includes(`'${activeCategory}'`);
        pill.classList.toggle("active", isActive);
        pill.setAttribute("aria-pressed", String(Boolean(isActive)));
      }
    };
    const observer = new MutationObserver(update);
    for (const category of sidebarCategories) {
      observer.observe(category, { attributes: true, attributeFilter: ["class"] });
    }
    observer.observe(listing, { childList: true, subtree: true });
    update();

    // List.js moves rows in the DOM when it filters. Restore a keyboard
    // user's focus to the same control once the row is back in place.
    listing.addEventListener("click", (event) => {
      const pill = event.target.closest("button.listing-category:focus-visible");
      if (pill) requestAnimationFrame(() => {
        if (document.activeElement === document.body) {
          (pill.isConnected ? pill : clear).focus();
        }
      });
    }, true);

    clear.addEventListener("click", () => {
      window.quartoListingCategory("");
      listing.querySelector(".listing-title a")?.focus();
    });
  })();
</script>
